name: Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /var/www/html/tutoring-app

            # Recover if the repo was left in an unfinished merge/rebase/cherry-pick state.
            git merge --abort || true
            git rebase --abort || true
            git cherry-pick --abort || true

            # Keep server-specific env values across repository hard reset.
            if [ -f back-end/.env ]; then
              cp back-end/.env /tmp/tutoring-app-backend.env
            fi

            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            git clean -fd

            if [ -f /tmp/tutoring-app-backend.env ]; then
              cp /tmp/tutoring-app-backend.env back-end/.env
            fi

            cd back-end
            npm install

            cd ../front-end
            npm install
            npm run build

            cd ../back-end
            pm2 restart tutoring-app --update-env