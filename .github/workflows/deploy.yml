name: Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /var/www/html/tutoring-app

            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

            cd back-end
            npm install

            cd ../front-end
            npm install
            npm run build

            cd ../back-end
            pm2 restart tutoring-app --update-env